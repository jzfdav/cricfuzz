<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CricFuzz</title>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Montserrat:wght@400;700;900&display=swap"
        rel="stylesheet">
  <script type="module" crossorigin src="/cricfuzz/assets/index.js"></script>
  <link rel="stylesheet" crossorigin href="/cricfuzz/assets/style.css">
</head>

<body class="overflow-x-hidden">

    <div id="config-screen" class="min-h-screen p-6 flex flex-col justify-between">
        <div class="text-center mt-10">
            <h2 class="text-xs uppercase tracking-[0.3em] text-amber-500 font-bold mb-2">Vibe Coded Simulation</h2>
            <h1 class="text-4xl font-black italic">CRICFUZZ</h1>
        </div>

        <div class="space-y-4">
            <div class="bg-[#161B22] p-4 rounded-2xl border border-gray-800">
                <div class="flex justify-between mb-2">
                    <label class="text-[10px] text-gray-500 uppercase">Batting Team</label>
                    <label class="text-[10px] text-gray-500 uppercase">Bowling Team</label>
                </div>
                <div class="flex justify-between items-center gap-2">
                    <select id="team1" onchange="app.preventSameTeam(this.value, 'team2')"
                        class="bg-transparent text-xl font-bold outline-none w-full text-amber-500">
                        <option value="ind">India</option>
                        <option value="aus">Australia</option>
                        <option value="eng">England</option>
                        <option value="afg">Afghanistan</option>
                        <option value="ban">Bangladesh</option>
                        <option value="ire">Ireland</option>
                        <option value="nz">New Zealand</option>
                        <option value="sl">Sri Lanka</option>
                        <option value="wi">West Indies</option>
                        <option value="zim">Zimbabwe</option>
                    </select>
                    <span class="text-gray-500 font-bold">VS</span>
                    <select id="team2" onchange="app.preventSameTeam(this.value, 'team1')"
                        class="bg-transparent text-xl font-bold outline-none w-full text-right text-amber-500"
                        dir="rtl">
                        <option value="aus">Australia</option>
                        <option value="ind">India</option>
                        <option value="eng">England</option>
                        <option value="afg">Afghanistan</option>
                        <option value="ban">Bangladesh</option>
                        <option value="ire">Ireland</option>
                        <option value="nz">New Zealand</option>
                        <option value="sl">Sri Lanka</option>
                        <option value="wi">West Indies</option>
                        <option value="zim">Zimbabwe</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="p-4 bg-[#161B22] rounded-2xl border border-gray-800">
                    <p class="text-[10px] text-gray-500 uppercase mb-2">Match Format</p>
                    <select id="match-format"
                        class="bg-transparent text-lg font-bold outline-none w-full text-amber-500">
                        <option value="T20">T20 (20 Overs)</option>
                        <option value="ODI">ODI (50 Overs)</option>
                        <option value="TEST">Test (4 Innings)</option>
                    </select>
                </div>
                <div class="p-4 bg-[#161B22] rounded-2xl border border-gray-800">
                    <p class="text-[10px] text-gray-500 uppercase mb-2">Match Intensity</p>
                    <input type="range" id="speed-slider" min="500" max="4000" value="2000" step="500"
                        class="w-full accent-amber-500">
                </div>
            </div>
        </div>

        <button onclick="app.startMatch()"
            class="w-full bg-amber-500 text-black py-5 rounded-2xl font-black uppercase tracking-widest text-xl shadow-lg active:scale-95 transition-transform">
            Start Simulation
        </button>
    </div>

    <div id="live-screen" class="hidden min-h-screen flex flex-col">
        <header class="bg-[#161B22] p-5 border-b border-amber-500/30 sticky top-0 z-20">
            <div class="flex justify-between items-end mb-4">
                <div>
                    <h1 id="score-display" class="text-4xl font-black mono tracking-tighter">0-0</h1>
                    <p id="overs-display" class="text-sm text-gray-400 font-bold">0.0 OVERS</p>
                </div>
                <div class="text-right">
                    <p id="target-display" class="text-[10px] text-gray-500 font-bold uppercase">1st INNINGS</p>
                    <p id="rr-display" class="text-xs text-gray-400">RR: 0.00</p>
                </div>
            </div>
            <!-- Live Speed Control -->
            <div class="flex items-center gap-2 bg-[#0B0E14] p-2 rounded-lg border border-gray-800">
                <span class="text-[10px] text-gray-500 uppercase whitespace-nowrap">Speed</span>
                <input type="range" id="live-speed-slider" min="500" max="4000" value="2000" step="500"
                    class="w-full accent-amber-500 h-1" oninput="app.state.speed = parseInt(this.value)">
            </div>
        </header>

        <section class="p-4 bg-[#0B0E14]">
            <div class="bg-[#161B22] rounded-xl p-4 border border-gray-800 grid grid-cols-2 gap-4 shadow-xl">
                <div>
                    <p id="striker" class="text-sm font-bold text-amber-400 italic">Striker...</p>
                    <p id="non-striker" class="text-xs text-gray-400 mt-1">Non-Striker...</p>
                </div>
                <div class="text-right border-l border-gray-700">
                    <p class="text-[10px] text-gray-500 uppercase">Bowler</p>
                    <p id="bowler" class="text-sm font-bold">Bowler Name</p>
                </div>
                <div id="timeline" class="col-span-2 flex gap-2 overflow-x-auto no-scrollbar py-2">
                </div>
            </div>
        </section>

        <main id="commentary-feed" class="flex-grow p-4 space-y-4 overflow-y-auto pb-20">
        </main>
    </div>

    <!-- Results Screen -->
    <div id="results-screen" class="hidden min-h-screen p-6 flex flex-col items-center">
        <div class="text-center mb-10 mt-10">
            <h2 class="text-xs uppercase tracking-[0.3em] text-amber-500 font-bold mb-2">Match Finished</h2>
            <h1 id="result-message" class="text-3xl font-black italic">WINNER MESSAGE</h1>
            <p id="match-description" class="text-sm text-gray-400 mt-2 max-w-md mx-auto"></p>
        </div>

        <div class="w-full max-w-2xl space-y-6 overflow-y-auto no-scrollbar pb-10">
            <div id="scorecard-container" class="space-y-8">
                <!-- Scorecard will be injected here -->
            </div>
        </div>

        <button onclick="app.resetToConfig()"
            class="w-full max-w-md bg-amber-500 text-black py-4 rounded-xl font-black uppercase tracking-widest text-sm active:scale-95 transition-transform mb-10">
            New Simulation
        </button>
    </div>

</body>

</html>
